<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="optionsTitle"></title>
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <div class="container">
    <header>
      <div class="title-container">
        <h1>
          <img class="app-icon" src="icons/icon.svg" alt="" width="32" height="32">
          <span data-i18n="extensionName"></span>
        </h1>
        <span class="version" id="versionInfo"></span>
      </div>
    </header>

    <div class="options-layout">
      <nav class="options-nav" data-i18n-aria-label="optionsSections" aria-label="Options sections">
        <p class="options-nav-title" data-i18n="settings"></p>
        <a href="#general-heading" class="options-nav-link" data-section="general" data-i18n="general"></a>
        <a href="#appearance-heading" class="options-nav-link" data-section="appearance" data-i18n="appearance"></a>
        <a href="#enhancements-heading" class="options-nav-link" data-section="enhancements" data-i18n="enhancements"></a>
        <a href="#behavior-heading" class="options-nav-link" data-section="behavior" data-i18n="behavior"></a>
        <a href="#domains-heading" class="options-nav-link" data-section="domains" data-i18n="domains"></a>
        <a href="#data-privacy-heading" class="options-nav-link" data-section="data" data-i18n="dataPrivacy"></a>
        <a href="#advanced-heading" class="options-nav-link" data-section="advanced" data-i18n="advanced"></a>
        <a href="#about-heading" class="options-nav-link" data-section="about" data-i18n="about"></a>
      </nav>

      <main class="options-content">
    <section id="general" class="extension-toggle-section" data-nav-section="general">
      <div class="extension-toggle-container">
        <div class="extension-toggle-text">
          <h2 data-i18n="extensionStatus"></h2>
          <p class="description" data-i18n="extensionStatusDescription"></p>
        </div>
        <label class="switch-toggle" data-i18n-aria-label="toggleExtension" aria-label="Toggle Extension">
          <input type="checkbox" id="extensionEnabled" checked>
          <span class="slider-round"></span>
        </label>
      </div>
      <div class="form-group theme-form-group">
        <label data-i18n="theme"></label>
        <div class="theme-segmented" id="themeGroup" role="group" data-i18n-aria-label="theme" aria-label="Theme">
          <button type="button" class="theme-segmented-btn" data-theme-value="system" aria-pressed="true" data-i18n-aria-label="themeSystem" aria-label="System" data-i18n-title="themeSystem">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path fill="currentColor" d="M12 3a9 9 0 0 1 0 18z"/></svg>
          </button>
          <button type="button" class="theme-segmented-btn" data-theme-value="light" aria-pressed="false" data-i18n-aria-label="themeLight" aria-label="Light" data-i18n-title="themeLight">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4" fill="currentColor"/><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
          </button>
          <button type="button" class="theme-segmented-btn" data-theme-value="dark" aria-pressed="false" data-i18n-aria-label="themeDark" aria-label="Dark" data-i18n-title="themeDark">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M20.35 13.4A8 8 0 1 1 10.6 3.65a6.5 6.5 0 0 0 9.75 9.75z"/></svg>
          </button>
        </div>
        <small class="help-text" data-i18n="themeHelp"></small>
      </div>
    </section>

    <section id="general-language" data-nav-section="general">
      <h2 data-i18n="languageSettings"></h2>
      <div class="form-group">
        <label for="language" data-i18n="language"></label>
        <select id="language">
          <option value="browser" data-i18n="languageBrowser"></option>
          <option value="en" data-i18n="languageEnglish"></option>
          <option value="de" data-i18n="languageGerman"></option>
          <option value="cs" data-i18n="languageCzech"></option>
          <option value="es" data-i18n="languageSpanish"></option>
          <option value="fr" data-i18n="languageFrench"></option>
          <option value="hu" data-i18n="languageHungarian"></option>
          <option value="it" data-i18n="languageItalian"></option>
          <option value="nl" data-i18n="languageDutch"></option>
          <option value="pl" data-i18n="languagePolish"></option>
        </select>
      </div>
    </section>

    <section id="interface-mobile" data-nav-section="enhancements">
      <h2 data-i18n="mobileFixes"></h2>
      <p class="description" data-i18n="mobileFixesDescription"></p>
      <div class="form-group checkbox-group">
        <label>
          <input type="checkbox" id="fixMobileWikiBreadcrumbs">
          <span data-i18n="fixMobileWikiBreadcrumbs"></span>
        </label>
        <small class="help-text" data-i18n="fixMobileWikiBreadcrumbsDescription"></small>
      </div>
    </section>

    <section id="interface" data-nav-section="appearance">
      <h2 data-i18n="interfaceOptions"></h2>
      <div class="form-group checkbox-group">
        <label>
          <input type="checkbox" id="keepMessengerExpanded">
          <span data-i18n="keepMessengerExpanded"></span>
        </label>
      </div>
      <div class="form-group checkbox-group">
        <label>
          <input type="checkbox" id="centerContentWithMessenger">
          <span data-i18n="centerContentWithMessenger"></span>
        </label>
      </div>
      <div class="form-group slider-group">
        <div class="slider-header">
          <label for="messengerPanelWidthPercent" data-i18n="messengerPanelWidth"></label>
          <output id="messengerPanelWidthValue" for="messengerPanelWidthPercent">100%</output>
        </div>
        <div class="slider-row">
          <input type="range" id="messengerPanelWidthPercent" min="50" max="125" step="5" value="100">
        </div>
        <p class="slider-help" data-i18n="savedApplied"></p>
      </div>
    </section>

    <section id="general-muting" data-nav-section="general">
      <h2 data-i18n="mutingOptions"></h2>
      <p class="description" data-i18n="mutingDescription"></p>
      <div class="form-group">
        <label for="defaultMuteDays" data-i18n="defaultMutePeriod"></label>
        <select id="defaultMuteDays">
          <option value="1" data-i18n="oneDay"></option>
          <option value="3" data-i18n="threeDays"></option>
          <option value="7" data-i18n="sevenDays"></option>
          <option value="14" data-i18n="fourteenDays"></option>
          <option value="30" data-i18n="thirtyDays"></option>
          <option value="90" data-i18n="ninetyDays"></option>
        </select>
      </div>
      <div class="form-group checkbox-group">
        <label>
          <input type="checkbox" id="showMutedIndicator">
          <span data-i18n="showHiddenCount"></span>
        </label>
      </div>
    </section>

    <section id="general-date-time" data-nav-section="general">
      <h2 data-i18n="dateTimeFormat"></h2>
      <p class="description" data-i18n="dateTimeDescription"></p>
      <div class="button-group" style="margin-bottom: 20px;">
        <button type="button" class="secondary" id="applyLocaleDefaults" data-i18n="applyBrowserLocale"></button>
      </div>

      <div class="form-group">
        <label for="dateFormat" data-i18n="dateFormat"></label>
        <select id="dateFormat">
          <option value="northAmerican12h" data-i18n="northAmericanDate"></option>
          <option value="westernEuropean24h" data-i18n="westernEuropeanDate"></option>
          <option value="centralEuropean24h" data-i18n="centralEuropeanDate"></option>
          <option value="dutch24h" data-i18n="dutchDate"></option>
          <option value="iso860124h" data-i18n="isoDate"></option>
          <option value="eastAsian24h" data-i18n="eastAsianDate"></option>
          <option value="hungarian24h" data-i18n="hungarianDate"></option>
          <option value="finnish24h" data-i18n="finnishDate"></option>
          <option value="spacedCentral24h" data-i18n="spacedCentralDate"></option>
          <option value="dottedSlavic24h" data-i18n="dottedSlavicDate"></option>
          <option value="spacedSlavic24h" data-i18n="spacedSlavicDate"></option>
          <option value="korean24h" data-i18n="koreanDate"></option>
          <option value="latinAmerican24h" data-i18n="latinAmericanDate"></option>
          <option value="middleEastern24h" data-i18n="middleEasternDate"></option>
          <option value="southeastAsian24h" data-i18n="southeastAsianDate"></option>
          <option value="southAsian12h" data-i18n="southAsianDate"></option>
        </select>
        <small class="help-text" data-i18n="chooseLocalePreset"></small>
      </div>

      <div class="form-group">
        <label for="timeFormat" data-i18n="timeFormat"></label>
        <select id="timeFormat">
          <option value="12h" data-i18n="twelveHour"></option>
          <option value="24h" data-i18n="twentyFourHour"></option>
        </select>
        <small class="help-text" data-i18n="chooseTimeFormat"></small>
      </div>
    </section>

    <section id="interface-avatars" data-nav-section="appearance">
      <h2 data-i18n="channelAvatarCustomization"></h2>
      <div class="form-group checkbox-group">
        <label>
          <input type="checkbox" id="enhanceChannelAvatars">
          <span data-i18n="replaceGroupIcons"></span>
        </label>
      </div>

      <div id="channelAvatarOptions" style="display: none;">
        <p class="description" data-i18n="avatarDescription"></p>

        <div style="display: flex; gap: 20px; align-items: flex-start; margin-bottom: 20px;">
          <!-- Preview -->
          <div class="avatar-preview-container">
            <h3 data-i18n="preview"></h3>
            <div class="avatar-preview-wrapper">
              <div class="avatar-preview empty-avatar cui-text-m" id="previewAvatar">
                <span id="previewInitials">HT</span>
              </div>
            </div>
          </div>

          <!-- Color Settings -->
          <div class="avatar-color-settings">
            <h3 data-i18n="backgroundColor"></h3>
            <div class="form-group">
              <label>
                <input type="radio" name="colorMode" value="random" id="colorModeRandom" checked>
                <span data-i18n="randomColorPerGroup"></span>
              </label>
            </div>
            <div class="form-group" style="display: flex; align-items: center; gap: 8px;">
              <label style="margin: 0;">
                <input type="radio" name="colorMode" value="fixed" id="colorModeFixed">
                <span data-i18n="fixedColor"></span>
              </label>
              <input type="color" id="channelAvatarFixedColor" value="#0f939d">
            </div>
          </div>
        </div>

      <div class="form-group">
        <label for="channelAvatarStyle" data-i18n="avatarStyle"></label>
        <select id="channelAvatarStyle">
          <option value="ring" data-i18n="ringBorder"></option>
          <option value="square" data-i18n="roundedSquare"></option>
          <option value="badge" data-i18n="iconBadgeOverlay"></option>
        </select>
        <small class="help-text" data-i18n="distinguishGroupChats"></small>
      </div>

      <!-- Ring Style Settings -->
      <div class="form-group style-settings" id="ringColorSettings">
        <label for="channelAvatarRingColor" data-i18n="ringCustomization"></label>
        <div class="color-input-group">
          <input type="color" id="channelAvatarRingColor" value="#502379">
          <input type="number" id="channelAvatarRingWidth" min="0" max="5" step="0.5" value="2">
          <span class="opacity-label" data-i18n="widthPx"></span>
          <button type="button" class="secondary reset-btn" id="resetRing" data-i18n="reset"></button>
        </div>
        <small class="help-text" data-i18n="customizeRing"></small>
      </div>

      <!-- Square Style Settings -->
      <div class="form-group style-settings" id="squareColorSettings" style="display: none;">
        <label for="channelAvatarSquareColor" data-i18n="squareCustomization"></label>
        <div class="color-input-group">
          <input type="color" id="channelAvatarSquareColor" value="#502379">
          <input type="number" id="channelAvatarSquareWidth" min="0" max="5" step="0.5" value="2">
          <span class="opacity-label" data-i18n="widthPx"></span>
          <button type="button" class="secondary reset-btn" id="resetSquare" data-i18n="reset"></button>
        </div>
        <small class="help-text" data-i18n="customizeSquare"></small>
      </div>

      <!-- Badge Style Settings -->
      <div class="form-group style-settings" id="badgeSizeSettings" style="display: none;">
        <label for="channelAvatarBadgeSize" data-i18n="badgeIconSize"></label>
        <div class="slider-input-group">
          <input type="range" id="channelAvatarBadgeSize" min="50" max="150" step="10" value="100">
          <span class="slider-value" id="badgeSizeValue">100%</span>
          <button type="button" class="secondary reset-btn" id="resetBadge" data-i18n="reset"></button>
        </div>
        <small class="help-text" data-i18n="adjustBadgeSize"></small>
      </div>

      <div class="form-group style-settings" id="badgePositionSettings" style="display: none;">
        <label for="channelAvatarBadgePosition" data-i18n="badgePosition"></label>
        <select id="channelAvatarBadgePosition">
          <option value="bottom-left" data-i18n="lowerLeft"></option>
          <option value="top-left" data-i18n="upperLeft"></option>
        </select>
        <small class="help-text" data-i18n="chooseBadgePosition"></small>
      </div>
      </div>
    </section>

    <section id="behavior-homepage" data-nav-section="behavior">
      <h2 data-i18n="customHomepageSettings"></h2>
      <p class="description" data-i18n="customHomepageDescription"></p>
      <div id="homepagesList" class="domains-list"></div>
    </section>

    <section id="interface-reactions" data-nav-section="enhancements">
      <h2 data-i18n="reactions"></h2>
      <p class="description" data-i18n="reactionsDescription"></p>
      <div class="form-group checkbox-group">
        <label>
          <input type="checkbox" id="sortReactionsByCount">
          <span data-i18n="sortReactions"></span>
        </label>
      </div>
      <div class="form-group checkbox-group">
        <label>
          <input type="checkbox" id="showReactionCountTooltip">
          <span data-i18n="reactionTooltip"></span>
        </label>
      </div>
      <div class="form-group checkbox-group">
        <label>
          <input type="checkbox" id="showReactionCountInline">
          <span data-i18n="reactionInline"></span>
        </label>
      </div>
    </section>

    <section id="interface-mentions" data-nav-section="enhancements">
      <h2 data-i18n="mentionFixes"></h2>
      <p class="description" data-i18n="mentionFixesDescription"></p>
      <div class="form-group checkbox-group">
        <label>
          <input type="checkbox" id="fixMentionFormatting">
          <span data-i18n="fixMentionFormatting"></span>
        </label>
        <small class="help-text" data-i18n="fixMentionFormattingDescription"></small>
      </div>
      <div class="form-group checkbox-group">
        <label>
          <input type="checkbox" id="fixMentionPopup">
          <span data-i18n="fixMentionPopup"></span>
        </label>
        <small class="help-text" data-i18n="fixMentionPopupDescription"></small>
      </div>
    </section>

    <section id="interface-editor" data-nav-section="enhancements">
      <h2 data-i18n="editorFixes"></h2>
      <p class="description" data-i18n="editorFixesDescription"></p>
      <div class="form-group checkbox-group">
        <label>
          <input type="checkbox" id="fixWikiModeToggle">
          <span data-i18n="fixWikiModeToggle"></span>
        </label>
        <small class="help-text" data-i18n="fixWikiModeToggleDescription"></small>
      </div>
      <div class="form-group checkbox-group">
        <label>
          <input type="checkbox" id="floatingRichTextToolbar">
          <span data-i18n="floatingRichTextToolbar"></span>
        </label>
        <small class="help-text" data-i18n="floatingRichTextToolbarDescription"></small>
      </div>
      <div class="form-group checkbox-group">
        <label>
          <input type="checkbox" id="markdownToolbar">
          <span data-i18n="markdownToolbar"></span>
        </label>
        <small class="help-text" data-i18n="markdownToolbarDescription"></small>
      </div>
      <div class="form-group checkbox-group" id="markdownToolbarBrandGroup">
        <label>
          <input type="checkbox" id="markdownToolbarBrand">
          <span data-i18n="markdownToolbarBrand"></span>
        </label>
        <small class="help-text" data-i18n="markdownToolbarBrandDescription"></small>
      </div>
      <div class="form-group checkbox-group">
        <label>
          <input type="checkbox" id="chatReplyMenu">
          <span data-i18n="chatReplyMenu"></span>
        </label>
        <small class="help-text" data-i18n="chatReplyMenuDescription"></small>
      </div>
    </section>

    <section id="behavior" data-nav-section="behavior">
      <p class="description" data-i18n="autoExpandDescription"></p>
      <div class="form-group checkbox-group">
        <label>
          <input type="checkbox" id="autoExpandEnabled">
          <span data-i18n="autoExpand"></span>
        </label>
      </div>
      <div class="form-group">
        <label for="autoExpandScope" data-i18n="whichLists"></label>
        <select id="autoExpandScope">
          <option value="both" data-i18n="bothLists"></option>
          <option value="workspaces" data-i18n="workspacesOnly"></option>
          <option value="pages" data-i18n="pagesOnly"></option>
        </select>
        <small class="help-text" data-i18n="chooseLists"></small>
      </div>
      <div class="form-group">
        <label for="autoExpandClicksPerList" data-i18n="showMoreClicks"></label>
        <input type="number" id="autoExpandClicksPerList" min="0" max="10" step="1" value="3">
        <small class="help-text" data-i18n="clicksHelp"></small>
      </div>
      <div class="form-group">
        <label for="autoExpandDelayMs" data-i18n="delayBetweenClicks"></label>
        <input type="number" id="autoExpandDelayMs" min="100" max="1000" step="50" value="300">
        <small class="help-text" data-i18n="delayHelp"></small>
      </div>
      <div class="form-group checkbox-group">
        <label>
          <input type="checkbox" id="endlessScrollEnabled">
          <span data-i18n="endlessScroll"></span>
        </label>
        <small class="help-text" data-i18n="endlessScrollDescription"></small>
      </div>
      <div class="form-group checkbox-group">
        <label>
          <input type="checkbox" id="autoLoadUpdatesEnabled">
          <span data-i18n="autoLoadUpdates"></span>
        </label>
        <small class="help-text" data-i18n="autoLoadUpdatesDescription"></small>
      </div>
      <div class="form-group slider-group">
        <div class="slider-header">
          <label for="autoLoadUpdatesIdleSec" data-i18n="autoLoadIdleSec"></label>
          <output id="autoLoadUpdatesIdleValue" for="autoLoadUpdatesIdleSec">5 s</output>
        </div>
        <div class="slider-row">
          <input type="range" id="autoLoadUpdatesIdleSec" min="0" max="600" step="5" value="5" disabled>
        </div>
        <p class="slider-help" data-i18n="autoLoadIdleSecHelp"></p>
      </div>
    </section>

    <section id="domains" data-nav-section="domains">
      <h2 data-i18n="domains"></h2>
      <p class="description" data-i18n="domainToggleDescription"></p>
      <div id="domainsList" class="domains-list"></div>
      <small class="help-text" data-i18n="domainToggleHelp"></small>
      <div class="form-group">
        <label for="newDomain" data-i18n="addCustomDomain"></label>
        <div class="domain-input-group">
          <input type="text" id="newDomain" data-i18n-placeholder="domainPlaceholder" placeholder="example.com">
          <button type="button" id="addDomain" class="secondary" data-i18n="addDomain"></button>
        </div>
        <small class="help-text" data-i18n="domainHelp"></small>
        <small class="help-text warning-text" id="chromePermissionWarning" data-i18n="chromePermissionWarning"></small>
      </div>
    </section>

    <section id="data" data-nav-section="data">
      <h2 data-i18n="dataManagement"></h2>
      <p class="description" data-i18n="dataLocalFirstIntro"></p>
      <p class="help-text legal-note">
        <button type="button" class="secondary legal-link" data-legal-doc="privacy" data-i18n="privacyPolicy"></button>
      </p>
      <div class="form-group checkbox-group">
        <label>
          <input type="checkbox" id="cloudSync">
          <span data-i18n="syncSettings"></span>
        </label>
        <small class="help-text" data-i18n="syncHelp"></small>
        <div id="cloudSyncWarning" class="reauth-warning" style="display: none;">
          <strong data-i18n="cloudSyncDisabled"></strong>
          <p data-i18n="cloudSyncDisabledDescription"></p>
        </div>
      </div>
      <p class="description" data-i18n="backupDescription"></p>
      <div class="button-group">
        <button id="exportData" class="secondary" data-i18n="exportSettings"></button>
        <button id="importData" class="secondary" data-i18n="importSettings"></button>
        <button id="clearAll" class="danger" data-i18n="resetEverything"></button>
      </div>
      <input type="file" id="importFile" accept=".json" style="display: none;">
      <div id="domainReauthWarning" class="reauth-warning" style="display: none;">
        <strong data-i18n="domainsNeedPermission"></strong>
        <p data-i18n="domainsNeedPermissionDescription"></p>
        <ul id="domainReauthList"></ul>
        <p data-i18n="domainsNeedPermissionHowTo"></p>
      </div>
    </section>

    <div class="save-status" id="saveStatus"></div>

    <section id="advanced" data-nav-section="advanced">
      <h2 data-i18n="advancedOptions"></h2>
      <div class="form-group checkbox-group">
        <label>
          <input type="checkbox" id="debugMode">
          <span data-i18n="debugLogging"></span>
        </label>
      </div>
    </section>

    <footer id="about" data-nav-section="about">
      <p class="footer-title" id="footerVersion">Haiilo Enhancer</p>
      <p class="credits" data-i18n="footerTagline"></p>
      <p class="footer-spacer"></p>
      <p class="license-text" data-i18n="copyright"></p>
      <p class="license-text" data-i18n="licensePermission"></p>
      <p class="license-text warranty-sentence">
        <span data-i18n="warranty"></span>
        <button type="button" class="legal-link" data-legal-doc="license" data-i18n="license"></button>
        <span data-i18n="forMoreDetails"></span>
      </p>
      <p class="license-text">
        <a href="https://github.com/nichu42/haiilo-enhancer/issues" target="_blank" rel="noopener" data-i18n="reportIssue"></a>
      </p>
      <p class="license-text footer-donate">
        <span class="donate-label" data-i18n="supportProject"></span>
        <a class="donate-link donate-liberapay" href="https://liberapay.com/nichu42/" target="_blank" rel="noopener" data-i18n-aria-label="donateLiberapay" aria-label="Donate on Liberapay">
          <svg class="donate-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="2" width="20" height="20" rx="4" fill="#f6c915"/><text x="12" y="16" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="800" font-size="11" fill="#1a171b">lp</text></svg>
          <span data-i18n="liberapay"></span>
